---
- name: Configure loopback and NTP on lab routers
  hosts: routers
  gather_facts: false
  vars:
    ntp_server: 192.168.32.1   # replace with your NTP server
  tasks:
    - name: Configure Loopback0
      cisco.ios.ios_config:
        parents: interface Loopback0
        lines:
          - ip address {{ loopback_ip }} 255.255.255.255
        save_when: modified

    - name: Configure NTP server
      cisco.ios.ios_config:
        lines:
          - ntp server {{ ntp_server }}
        save_when: modified